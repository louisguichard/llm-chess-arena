{% extends "base.html" %}

{% block head %}
    <script>
        function showPage(page) {
            const battleEl = document.getElementById('battle-page');
            const leaderboardEl = document.getElementById('leaderboard-page');
            const aboutEl = document.getElementById('about-page');
            if (battleEl) battleEl.style.display = page === 'battle' ? 'block' : 'none';
            if (leaderboardEl) leaderboardEl.style.display = page === 'leaderboard' ? 'block' : 'none';
            if (aboutEl) aboutEl.style.display = page === 'about' ? 'block' : 'none';

            // Update desktop nav active state
            document.querySelectorAll('.nav-link').forEach(btn => {
                const active = btn.dataset.page === page;
                btn.classList.toggle('text-green-600', active);
                btn.classList.toggle('dark:text-green-400', active);
                btn.classList.toggle('text-gray-600', !active);
                btn.classList.toggle('dark:text-gray-300', !active);
            });

            // Update mobile nav active state
            document.querySelectorAll('.mobile-nav-link').forEach(btn => {
                const active = btn.dataset.page === page;
                btn.classList.toggle('text-indigo-500', active);
                btn.classList.toggle('text-gray-500', !active);
                btn.classList.toggle('dark:text-gray-400', !active);
            });
        }

        function routePathFor(page) {
            if (page === 'leaderboard') return '/leaderboard';
            if (page === 'about') return '/about';
            return '/battle';
        }
    
        function navigateTo(page, replace) {
            const path = routePathFor(page);
            const url = new URL(window.location.href);
            const gameParam = url.searchParams.get('game');
            let newPath = path;
            if (gameParam && page === 'battle') {
                newPath += '?game=' + encodeURIComponent(gameParam);
            }
            if (replace) {
                history.replaceState({ page: page }, '', newPath);
            } else {
                history.pushState({ page: page }, '', newPath);
            }
            showPage(page);
        }
    </script>
{% endblock %}

{% block content %}
<div id="battle-page">
    {% include 'battle.html' %}
</div>
<div id="leaderboard-page" style="display: none;">
    {% include 'leaderboard.html' %}
</div>
<div id="about-page" style="display: none;">
    {% include 'about.html' %}
</div>
{% endblock %}

{% block scripts %}
{{ super() }}
<script src="{{ url_for('static', filename='js/battle.js') }}"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        let initialPage = 'battle';
        if (window.location.pathname.indexOf('/leaderboard') !== -1) initialPage = 'leaderboard';
        if (window.location.pathname.indexOf('/about') !== -1) initialPage = 'about';
        navigateTo(initialPage, true);

        document.querySelectorAll('.nav-link, .mobile-nav-link').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const page = e.currentTarget.dataset.page;
                if (page) navigateTo(page, false);
            });
        });

        window.addEventListener('popstate', (e) => {
            let page = e.state && e.state.page;
            if (!page) {
                if (window.location.pathname.indexOf('/leaderboard') !== -1) page = 'leaderboard';
                else if (window.location.pathname.indexOf('/about') !== -1) page = 'about';
                else page = 'battle';
            }
            showPage(page);
        });

        // Mobile leaderboard toggle: tap on model cell to show/hide details row
        document.addEventListener('click', (e) => {
            const toggleCell = e.target.closest('td.mobile-toggle');
            if (!toggleCell) return;
            const row = toggleCell.parentElement;
            const detailsRow = row.nextElementSibling;
            if (!detailsRow || !detailsRow.classList.contains('mobile-details')) return;
            detailsRow.classList.toggle('hidden');
        });

    });
</script>
{% endblock %}
